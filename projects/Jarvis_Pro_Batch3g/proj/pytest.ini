# Explicit discovery (Phase 16). Nothing is excluded to hide failures:
# tests/ holds every automated test; manual_demos/ holds the interactive
# demonstration scripts that previously broke collection via input().
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = manual_demos .git build dist __pycache__ android
addopts = -ra
